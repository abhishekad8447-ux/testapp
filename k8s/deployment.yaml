apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-manager

  template:
    metadata:
      labels:
        app: task-manager

    spec:
      containers:
        - name: task-manager
          image: task-manager:v1

          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgresql://taskuser:taskpass@db:5432/tasks"

          ports:
            - containerPort: 8080

          imagePullPolicy: IfNotPresent
