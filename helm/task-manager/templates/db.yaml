apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "task-manager.name" . }}
    app.kubernetes.io/component: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "task-manager.fullname" . }}-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.fullname" . }}-db
  labels:
    app.kubernetes.io/name: {{ include "task-manager.name" . }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "task-manager.name" . }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "task-manager.name" . }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-manager.fullname" . }}-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.database.username }} -d {{ .Values.database.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.database.username }} -d {{ .Values.database.database }}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "task-manager.fullname" . }}-db
